services:
  master:
    image: ghcr.io/thnaylor/baboviolent2-master:edge
    # Deployment note: the master lists each game server by the source IP it
    # observes on the server's TCP connection (when that address is public).
    # Native Linux Docker preserves real source IPs on published ports, so a
    # Linux host works like a bare-metal master. Docker Desktop (Windows/mac)
    # proxies published ports and masks EVERY peer as the bridge gateway
    # (172.x.0.1) — behind it, game servers are only listed correctly if they
    # self-report a public IP (SV_IP or auto-detect). Prefer a Linux host.
    ports:
      - "10207:10207/tcp"
    environment:
      # Gates the cacheban/cacheunban remote-admin commands (dedicated server
      # console -> master ban-list writes). Required: with this unset, the
      # master rejects all cacheban/cacheunban requests (fails closed) rather
      # than falling back to any built-in value. Set your own secret here and
      # pass the same value to the dedicated server's ADMIN console when using
      # those commands.
      MASTER_CACHEBAN_PASS: ""
    volumes:
      # Mount ONLY the data dir. Mounting a named volume over /app pins the
      # container to whatever binary the volume captured on first use —
      # image updates are silently ignored from then on.
      - master-data:/app/data
    restart: unless-stopped

  baboviolent2:
    image: ghcr.io/thnaylor/baboviolent2:edge
    ports:
      - "3334:3333/tcp"
      - "3334:3333/udp"
    environment:
      # Public IP announced to the master server.
      # Inside Docker the server detects its internal 172.x container IP, which
      # is unreachable by clients. Set this to your host's real public IP.
      # Leave blank to auto-detect on startup (requires outbound HTTP/HTTPS).
      # The dedicated logs "Announcing server IP ..." showing the value used;
      # the master logs the listing decision per server ("New game ... listed
      # as ..."), so both sides can be checked when an entry looks wrong.
      SV_IP: ""

      # Master server to register with. "master" is the bundled service above,
      # reached over the Docker network — required when master and dedicated
      # run behind the same NAT, where dialing the public DNS name would need
      # hairpin NAT support on the router. Remove both to use the public
      # default masters (babo.hostfrog.co.za, babo.soh.re).
      MASTER_HOST: "master"
      MASTER_PORT: 10207

      # Server identity
      GAME_MODE: FFA              # FFA | CTF | TDM | Champion
      GAMETYPE_ROTATION: "0 1 2"  # space-separated gametype IDs: 0=FFA 1=TDM 2=CTF 3=Champion; omit to use GAME_MODE only
      SERVER_NAME: "BaboViolent 2 Server"
      MAX_PLAYERS: 32
      MAX_PLAYERS_IN_GAME: 0      # 0 = no spectator limit; set equal to MAX_PLAYERS to disable spectating
      PORT: 3334
      PASSWORD: ""               # leave empty for no password
      GAME_PUBLIC: "true"        # true = register on master server
      ADMIN_USER: ""
      ADMIN_PASS: ""

      # Server UX
      SEND_JOIN_MESSAGE: "true"
      JOIN_MESSAGE: "Welcome to the server!"
      MAX_PING: 1000             # kick players above this ping; 1000 = disabled
      SHOW_KILLS: "true"
      MAX_UPLOAD_RATE: 8         # KB/s upload cap per client

      # Gameplay
      FRIENDLY_FIRE: "false"
      REFLECTED_DAMAGE: "true"
      RESPAWN_TIME: 5            # seconds
      FORCE_RESPAWN: "false"
      ROUND_TIME_LIMIT: 360      # seconds
      GAME_TIME_LIMIT: 900       # seconds
      SCORE_LIMIT: 50
      WIN_LIMIT: 7
      BOMB_TIME: 60              # seconds (CTF/bomb mode)
      SLIDE_ON_ICE: "false"
      SHOW_ENEMY_TAG: "true"
      AUTO_BALANCE: "true"      # recommended true for CTF / TDM
      AUTO_BALANCE_TIME: 4       # seconds before teams are rebalanced
      ENABLE_VOTE: "true"
      SPAWN_IMMUNITY_TIME: 2     # invincibility seconds after spawn
      MIN_TILES_PER_BABO: 55    # minimum map size filter (tiles per player)
      MAX_TILES_PER_BABO: 80    # maximum map size filter (tiles per player)

      # Weapon enables
      ENABLE_SMG: "true"
      ENABLE_SHOTGUN: "true"
      ENABLE_SNIPER: "true"
      ENABLE_DUAL_MG: "true"
      ENABLE_CHAIN_GUN: "true"
      ENABLE_BAZOOKA: "true"
      ENABLE_SHOTGUN_RELOAD: "true"
      ENABLE_FLAMETHROWER: "true"
      ENABLE_PHOTON_RIFLE: "true"
      ENABLE_SECONDARY: "true"
      ENABLE_KNIVES: "true"
      ENABLE_MOLOTOV: "true"
      ENABLE_SHIELD: "true"
      ENABLE_MINIBOT: "false"
      ENABLE_NUCLEAR: "false"
      EXPLODING_FT: "false"      # flamethrower projectiles explode on impact

      # Weapon stats
      ZOOKA_REMOTE_DET: "true"
      SMG_DAMAGE: 0.1
      DMG_DAMAGE: 0.14
      CG_DAMAGE: 0.16
      SNIPER_DAMAGE: 0.34
      SHOTTY_DAMAGE: 0.21
      SHOTTY_DROP_RADIUS: 0.35
      SHOTTY_RANGE: 6.75
      ZOOKA_DAMAGE: 0.85
      ZOOKA_RADIUS: 2
      NUKE_RADIUS: 6
      NUKE_TIMER: 3
      NUKE_RELOAD: 12
      FT_DAMAGE: 0.065
      FT_MAX_RANGE: 8
      FT_MIN_RANGE: 1
      FT_EXPIRATION_TIMER: 1.5
      PHOTON_DAMAGE_COEFF: 0.65
      PHOTON_DIST_MULT: 0.65
      PHOTON_VERTICAL_SHIFT: 0.5
      PHOTON_HORIZONTAL_SHIFT: 2
      PHOTON_TYPE: 1

volumes:
  master-data:
