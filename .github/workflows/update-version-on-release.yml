name: Update Version.h on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Determine release tag
        id: tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update src/Version.h
        run: |
          set -euo pipefail
          TAG=${{ steps.tag.outputs.TAG }}
          # strip leading v if present
          VERSION=${TAG#v}
          echo "Updating src/Version.h to $VERSION"
          perl -0777 -pe "s/#define BV2_RELEASE_STRING \".*?\"/#define BV2_RELEASE_STRING \"${VERSION}\"/s" -i src/Version.h

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Version.h
          git commit -m "chore(release): set BV2 release string to ${GITHUB_REF#refs/tags/}" || echo "no change to commit"
          git push
