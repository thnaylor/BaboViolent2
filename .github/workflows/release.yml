name: Release

# Builds platform packages and attaches them to the GitHub Release created by
# release-please when its release PR is merged (release published event).
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Release (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: zip
          - platform: windows
            archive: zip

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libsdl2-mixer-dev \
            g++-mingw-w64-x86-64 mingw-w64-tools \
            sqlite3 zip

      - name: Build (${{ matrix.platform }})
        env:
          BV2_PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/ci-build.sh

      - name: Package (${{ matrix.platform }})
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          BV2_PLATFORM: ${{ matrix.platform }}
          BV2_ARCHIVE: ${{ matrix.archive }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/package-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
