name: Release Pipeline

on:
  push:
    branches:
      - modern
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release-build:
    name: Release (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: zip
          - platform: windows
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set release version from tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          echo "Using release version ${VERSION} for build artifacts"
          perl -0777 -pe "s/#define BV2_RELEASE_STRING \".*?\"/#define BV2_RELEASE_STRING \"${VERSION}\"/s" -i src/Version.h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libsdl2-mixer-dev \
            g++-mingw-w64-x86-64 mingw-w64-tools \
            sqlite3 zip

      - name: Build (${{ matrix.platform }})
        env:
          BV2_PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/ci-build.sh

      - name: Package (${{ matrix.platform }})
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          BV2_PLATFORM: ${{ matrix.platform }}
          BV2_ARCHIVE: ${{ matrix.archive }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/package-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-build-linux-servers:
    name: Release servers (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported Debian releases as of 2026-06-01.
          - distro: debian-13-trixie
            image: debian:trixie-slim
          - distro: debian-12-bookworm
            image: debian:bookworm-slim
          - distro: debian-11-bullseye
            image: debian:bullseye-slim
          # Supported Fedora releases as of 2026-06-01 (42 EOL 2026-05-13).
          - distro: fedora-44
            image: fedora:44
          - distro: fedora-43
            image: fedora:43
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
          else
            dnf install -y ca-certificates git
          fi

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set release version from tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          echo "Using release version ${VERSION} for build artifacts"
          perl -0777 -pe "s/#define BV2_RELEASE_STRING \".*?\"/#define BV2_RELEASE_STRING \"${VERSION}\"/s" -i src/Version.h

      - name: Install build dependencies
        run: bash ./scripts/ci-install-linux-deps.sh

      - name: Build BaboViolentDedicated + BaboMasterServer
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.distro }}
        run: bash ./scripts/ci-build-servers.sh

      - name: Package dedicated + master (${{ matrix.distro }})
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.distro }}
          BV2_DISTRO: ${{ matrix.distro }}
        run: bash ./scripts/package-linux-servers-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
