name: CI

on:
  push:
    branches: [main, modern, master]
  pull_request:

jobs:
  build-linux-servers:
    name: Servers (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported Debian releases as of 2026-06-01.
          - distro: debian-13-trixie
            image: debian:trixie-slim
          - distro: debian-12-bookworm
            image: debian:bookworm-slim
          - distro: debian-11-bullseye
            image: debian:bullseye-slim
          # Supported Fedora releases as of 2026-06-01 (42 EOL 2026-05-13).
          - distro: fedora-44
            image: fedora:44
          - distro: fedora-43
            image: fedora:43
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git for checkout
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
          else
            dnf install -y ca-certificates git
          fi

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: bash ./scripts/ci-install-linux-deps.sh

      - name: Build BaboViolentDedicated + BaboMasterServer
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.distro }}
        run: bash ./scripts/ci-build-servers.sh

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: zip
          - platform: windows
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libsdl2-mixer-dev \
            g++-mingw-w64-x86-64 mingw-w64-tools \
            sqlite3 zip

      - name: Verify toolchains
        run: |
          set -euo pipefail
          echo "Matrix platform: ${{ matrix.platform }}"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            echo "Local compilers:"
            gcc --version || true
            g++ --version || true
            echo "Cross compilers:"
            command -v x86_64-w64-mingw32-g++ || echo "Mingw cross-compiler missing"
            x86_64-w64-mingw32-g++ --version || true
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            echo "Cross compilers:"
            command -v x86_64-w64-mingw32-g++ || echo "Mingw cross-compiler missing"
            x86_64-w64-mingw32-g++ --version || true
          fi

      - name: Build (${{ matrix.platform }})
        env:
          BV2_PLATFORM: ${{ matrix.platform }}
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/ci-build.sh

      - name: Package (${{ matrix.platform }})
        env:
          BUILD: ${{ github.workspace }}/build-${{ matrix.platform }}
          BV2_PLATFORM: ${{ matrix.platform }}
          BV2_ARCHIVE: ${{ matrix.archive }}
          OSXCROSS_SDK_VERSION: "12.3"
        run: bash ./scripts/package-release.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: bv2-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
